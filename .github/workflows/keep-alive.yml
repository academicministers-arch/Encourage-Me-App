name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://encourage-me-app.onrender.com/api/health)
          echo "Response code: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: unexpected status code $response"
            exit 1
          fi
